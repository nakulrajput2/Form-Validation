<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
        }
        h2{
            padding-left: 30px;
        }
        .container{
            width:350px;
            background:white;
            padding:20px;
            padding-right: 40px !important;
            margin:40px auto;
            border-radius:10px;
            box-shadow:0 0 10px #aaa;
        }
        input, select{
            width:100%;
            padding:8px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:4px;
        }
        #course{
            width:105%;
        }
        button{
            width:105%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }
        button:hover{
            background:#0056b3;
        }
        .error{
            color:red;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form id="regForm">
        <label>Full Name</label>
        <input type="text" id="name">

        <label>Age</label>
        <input type="number" id="age">

        <label>Email</label>
        <input type="text" id="email">

        <label>Address</label>
        <input type="text" id="address">

        <label>Course</label>
        <select id="course">
            <option value="">-- Select Course --</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="BSc-IT">BSc-IT</option>
            <option value="MBA">MBA</option>
        </select>

        <p class="error" id="errorMsg"></p>

        <button type="button" onclick="validateForm()">Submit</button>
    </form>
</div>


<script>
function validateForm()
{

    let name = document.getElementById("name").value;
    let age = document.getElementById("age").value;
    let email = document.getElementById("email").value;
    let address = document.getElementById("address").value;
    let course = document.getElementById("course").value;

    let error = document.getElementById("errorMsg");

    if(name===""|| age==="" || email==="" || address==="" || course==="")
    {
        error.style.color = "red";
        error.innerHTML = "All fields are required. \nPlease fill them.";
        return;
    }
    else
    {
        if(isAlphabetic(name))
        {
            if(isAge(age))
            {
                if(isEmailValidation(email)){
                    error.style.color = "green";
                    error.innerHTML = "Form Submitted Successfully!";
                    return;
                }
                else{
                    error.style.color = "red";
                    error.innerHTML = "Invalid Email Address.";
                    return;
                }
            }
            else{
                error.style.color = "red";
                error.innerHTML = "Invalid Age. Age should be between 18 and 30.";
                return;
            }
        }
        else{
            error.style.color = "red";
            error.innerHTML = "Name should be contained with alphbets only.";
            return;
        }
    }
}

function isAlphabetic(input) 
{
  let len=input.length,count=0;
  let upper=input.toUpperCase();
  for(let i=0;i<len;i++)
  {
    let ch=upper.charAt(i);
    if((ch>="A" && ch<="Z") || ch==" ")
    {
      count++;
    }
  }
    if(count==len)
    {
      return true;
    }
    return false;
}

function isAge(input)
{
    let age = parseInt(input);
    if(age>=18 && age<=30)
    {
        return true;
    }
    return false;
}

function isEmailValidation(email){

    // Rule 1: Minimum length check
    if(email.length < 6){
        return false;
    }

    let atCount = 0;
    let atIndex = -1;
    let dotIndex = -1;

    // Loop through each character
    for(let i = 0; i < email.length; i++){
        if(email[i] === '@'){
            atCount++;
            atIndex = i;
        }

        // if dot found after @, store its index
        if(atIndex !== -1 && email[i] === '.'){
            dotIndex = i;
        }
    }

    // Rule 2: Only one @ allowed
    if(atCount !== 1){
        return false;
    }

    // Rule 3: @ cannot be first character
    if(atIndex === 0){
        return false;
    }

    // Rule 4: Dot must exist after @
    if(dotIndex === -1){
        return false;
    }

    // Rule 5: Dot cannot be immediately after @
    if(dotIndex === atIndex + 1){
        return false;
    }

    // Rule 6: Dot cannot be the last character
    if(dotIndex === email.length - 1){
        return false;
    }

    return true;
}

</script>

</body>
</html>
